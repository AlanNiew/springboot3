server:
  port: 8092
spring:
  rabbitmq:
    host: 192.168.220.128
    port: 5672
    username: admin
    password: admin
    virtual-host: /
    listener:
      simple:
        prefetch: 1
        auto-startup: true # 自动启动 RabbitMQ 的消息监听器容器, 默认为 true
      type: simple # 默认使用 SimpleMessageListenerContainer